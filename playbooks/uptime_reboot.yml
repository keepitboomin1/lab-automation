---
- name: Check uptime and reboot if over 5 days
  hosts: lab
  gather_facts: true
  become: false

  tasks:

    - name: Display current uptime in seconds
      ansible.builtin.debug:
        msg: "[{{ inventory_hostname }}] Uptime: {{ ansible_uptime_seconds }} seconds"

    - name: Reboot if uptime exceeds 5 days
      ansible.builtin.reboot:
        msg: "Rebooting - uptime exceeded 5 days"
        reboot_timeout: 300
      become: true
      when: ansible_uptime_seconds > 432000
